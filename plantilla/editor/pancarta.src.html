<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de pancartas</title>
<meta name="description" content="Pancartas, pendones, roll-ups y afiches con el estilo Tazón para Dos: escribe el texto, pega una imagen y descarga el PDF a tamaño real.">
<style>/*CSS*/</style>
</head>
<body><!--tpd-eco--><style>.tpd-eco{position:relative;z-index:40;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;background:#110D18;border-bottom:2px solid #F8CB67;padding:5px 12px;font:500 11px/1.2 'DM Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}.tpd-eco::-webkit-scrollbar{display:none}.tpd-eco b{color:#F8CB67;font:700 12px 'Space Grotesk',system-ui,sans-serif;letter-spacing:.04em;margin-right:8px}.tpd-eco a{color:#F7F2E8;text-decoration:none;padding:4px 9px;border-radius:999px;flex:none}.tpd-eco a:hover,.tpd-eco a:focus-visible{background:#2B2340;outline:none}.tpd-eco a[aria-current=page]{background:#F8CB67;color:#28203B}@media print{.tpd-eco{display:none!important}}</style><nav class="tpd-eco" aria-label="Tazón para Dos: sitios y herramientas"><b>TAZÓN PARA DOS</b><a href="https://thetrashkat.github.io/historias-tazon/">Inicio</a><a href="index.html">Editor de historias</a><a href="pancarta.html" aria-current="page">Editor de pancartas</a><a href="https://thetrashkat.github.io/historias-tazon/#historias">Historias</a><a href="https://thetrashkat.github.io/tazon-para-dos-marca/">Marca</a><a href="https://thetrashkat.github.io/tazon-para-dos-marca/divisores.html">Divisores</a><a href="https://thetrashkat.github.io/tazon-para-dos-tinieblas/">Tinieblas</a><a href="https://thetrashkat.github.io/biblioteca-aventuras/">Biblioteca</a><a href="https://thetrashkat.github.io/tazon-para-dos-web/">Web Tazón</a></nav><!--/tpd-eco-->
<header class="cabecera">
  <div class="marca-ed"><img id="sello-ed" alt=""><div><b>Editor de pancartas</b><span>Tazón para Dos · impresos</span></div></div>
  <nav class="acciones">
    <div class="grupo">
      <button class="btn" id="b-deshacer" title="Deshacer (Ctrl+Z)" disabled>↶ Deshacer</button>
      <button class="btn" id="b-plantillas" aria-haspopup="true">✦ Plantillas</button>
    </div>
    <div class="grupo">
      <button class="btn" id="b-abrir">Abrir proyecto</button>
      <button class="btn" id="b-guardar">Guardar proyecto</button>
      <button class="btn teal" id="b-png">Descargar PNG</button>
      <button class="btn sol" id="b-html">Descargar HTML</button>
      <button class="btn coral" id="b-pdf">Imprimir / PDF</button>
    </div>
  </nav>
</header>
<div class="pestanas" role="tablist">
  <button class="activa" data-p="editar">Editar</button><button data-p="vista">Vista previa</button>
</div>
<main class="area">
  <section class="editor" id="editor" aria-label="Contenido de la pancarta"></section>
  <section class="vista" aria-label="Vista previa">
    <div class="vista-barra">
      <span>Vista previa · <b class="pista">clic en un texto de la pancarta para ir a su campo</b></span>
      <span id="medida" class="medida"></span>
    </div>
    <div class="marco-vista lienzo" id="lienzo"></div>
  </section>
</main>
<div class="menu" id="menu-plantillas" hidden></div>
<input type="file" id="f-proyecto" accept=".json,application/json" hidden>
<input type="file" id="f-imagen" accept="image/*" hidden>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>
<script>/*RECURSOS*/</script>
<script>/*COMUN*/</script>
<script>/*JS*/</script>
</body>
</html>
